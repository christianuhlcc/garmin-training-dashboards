# Logbook site on shopmate's edge nginx (the EC2 instance shared with shopmate).
#
# setup.sh renders this (@DOMAIN@ -> the logbook domain) into /srv/garmin/nginx/logbook.conf, but only once the
# Let's Encrypt cert exists: nginx refuses to start when an ssl_certificate file is missing, and shopmate's nginx
# includes /etc/nginx/logbook/*.conf (http context). No file = no logbook, shopmate unaffected.
#
# Container paths (bind mounts in shopmate's docker-compose.prod.yml):
#   /etc/nginx/logbook/        <- /srv/garmin/nginx      (this file + htpasswd, read-only)
#   /srv/logbook/site/         <- /srv/garmin/site       (built static site, read-only)
#   /srv/logbook/upload/       <- /srv/garmin/upload     (inbox/ + tmp/, writable by nginx uid 101)

# Whole site: a page load is ~15 requests. Generous for a human, slows scripted password guessing.
limit_req_zone $binary_remote_addr zone=logbook_all:1m rate=10r/s;
# Uploads / sync triggers: each one starts a Garmin sync + rebuild.
limit_req_zone $binary_remote_addr zone=logbook_inbox:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    # Let's Encrypt renewals (webroot, shared volume with shopmate's certbot sidecar)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://@DOMAIN@$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @DOMAIN@;

    ssl_certificate     /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;

    # One user, one long random password (deploy/set-secrets.sh). The file is read per request:
    # if it is missing, nginx answers 403 - it fails closed, never open (tested in nginx:1.27-alpine).
    auth_basic           "Logbook";
    auth_basic_user_file /etc/nginx/logbook/htpasswd;
    limit_req            zone=logbook_all burst=60 nodelay;
    limit_req_status     429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # OpenStreetMap's tile policy wants a Referer; this sends only the origin.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Personal data: no shared caches; the phone revalidates (ETag) instead of re-downloading.
    add_header Cache-Control "private, no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    root  /srv/logbook/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Write path: PUT of exactly these files, nothing else (no GET/DELETE/listing).
    #   workout_2026.txt  the Apple Note as plain text (iPhone Shortcut / Mac push)
    #   review.json       a weekly review generated on the Mac
    #   sync              empty body: just run a sync now ("Sync now" button)
    # A systemd path unit on the host notices the non-empty inbox and runs the sync job.
    location ~ ^/inbox/(workout_2026\.txt|review\.json|sync)$ {
        limit_except PUT { deny all; }
        limit_req zone=logbook_inbox burst=5 nodelay;
        root /srv/logbook/upload;                       # -> /srv/logbook/upload/inbox/<name>
        client_body_temp_path /srv/logbook/upload/tmp;  # same filesystem as inbox/: rename, not copy
        client_max_body_size 2m;
        dav_methods PUT;
        dav_access user:rw group:rw;
        create_full_put_path off;
    }

    location /inbox/ {
        return 404;
    }
}
